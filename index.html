<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OR finance" />
    <meta name="description" content="OR finance - Organizador financeiro pessoal" />
    <link id="pwa-manifest" rel="manifest" />
    <link id="pwa-apple-icon" rel="apple-touch-icon" />
    <title translate="no">OR finance</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #fff;
        background: #050505;
      }

      html,
      body,
      #root {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #050505;
      }

      body {
        min-height: 100vh;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      input,
      select,
      textarea {
        font: inherit;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #262626;
        border-radius: 9px;
        background: #101010;
        color: #fff;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #555;
      }

      .app {
        min-height: 100vh;
        background: #050505;
        color: #fff;
      }

      .layout {
        display: flex;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 250px;
        padding: 28px 18px;
        background: #080808;
        border-right: 1px solid #1d1d1d;
        z-index: 1000;
        display: flex;
        flex-direction: column;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 4px 8px 30px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        border: 1px solid #fff;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 800;
        flex-shrink: 0;
      }

      .brand-name {
        font-size: 18px;
        font-weight: 750;
      }

      .brand-subtitle,
      .eyebrow,
      .panel-title span,
      .page span {
        color: #666;
        font-size: 9px;
        letter-spacing: 1.8px;
        font-weight: 700;
      }

      .nav {
        display: grid;
        gap: 5px;
        overflow-y: auto;
        padding-bottom: 16px;
      }

      .nav-button,
      .settings-button {
        width: 100%;
        padding: 12px 13px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #777;
        text-align: left;
      }

      .nav-button:hover,
      .nav-button.active,
      .settings-button:hover {
        background: #151515;
        color: #fff;
      }

      .settings-button {
        margin-top: auto;
        border-top: 1px solid #181818;
        border-radius: 0;
        padding-top: 16px;
      }

      .overlay {
        display: none;
      }

      .main {
        width: calc(100% - 250px);
        margin-left: 250px;
      }

      .topbar {
        height: 90px;
        padding: 20px 42px;
        border-bottom: 1px solid #1d1d1d;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .topbar > div:nth-child(2) {
        flex: 1;
      }

      .topbar h1 {
        margin: 4px 0 0;
        font-size: 25px;
        font-weight: 700;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .profile {
        width: 38px;
        height: 38px;
        border: 1px solid #333;
        border-radius: 50%;
        background: #101010;
        display: grid;
        place-items: center;
        color: #aaa;
        font-size: 12px;
      }

      .profile:hover {
        border-color: #666;
        color: #fff;
      }

      .mobile-menu {
        display: none;
        border: 1px solid #292929;
        border-radius: 9px;
        background: #101010;
        color: #fff;
        width: 42px;
        height: 42px;
      }

      .content {
        padding: 38px 42px;
        max-width: 1450px;
      }

      .hero {
        min-height: 170px;
        padding: 32px;
        border: 1px solid #222;
        border-radius: 20px;
        background: linear-gradient(135deg, #111, #080808);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }

      .hero span,
      .stat-card span {
        display: block;
        color: #777;
        font-size: 12px;
        margin-bottom: 10px;
      }

      .hero strong {
        display: block;
        font-size: 42px;
        letter-spacing: -1.5px;
      }

      .hero-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .primary-button {
        padding: 13px 18px;
        border: 0;
        border-radius: 9px;
        background: #fff;
        color: #000;
        font-weight: 700;
      }

      .secondary-button {
        padding: 10px 14px;
        border: 1px solid #2b2b2b;
        border-radius: 9px;
        background: #121212;
        color: #ddd;
        font-weight: 600;
      }

      .secondary-button:hover {
        background: #1b1b1b;
        color: #fff;
      }

      .danger-button {
        padding: 10px 14px;
        border: 1px solid #5c1f1f;
        border-radius: 9px;
        background: #240d0d;
        color: #fca5a5;
        font-weight: 600;
      }

      .danger-button:hover {
        background: #361212;
        color: #fff;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 2000;
      }

      .modal-card {
        width: 100%;
        max-width: 450px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 24px;
        border: 1px solid #262626;
        border-radius: 16px;
        background: #0d0d0d;
      }

      .modal-card h3 {
        margin: 6px 0 8px;
        font-size: 18px;
      }

      .modal-card p {
        margin: 0 0 18px;
        color: #777;
        font-size: 13px;
      }

      .modal-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 12px;
      }

      .option-btn {
        padding: 16px 12px;
        border: 1px solid #2b2b2b;
        border-radius: 12px;
        background: #121212;
        color: #fff;
        font-weight: 700;
        display: grid;
        gap: 4px;
        text-align: center;
      }

      .option-btn:hover {
        background: #1c1c1c;
        border-color: #fff;
      }

      .settings-section {
        border-top: 1px solid #1e1e1e;
        padding-top: 16px;
        margin-top: 16px;
      }

      .manual-box {
        padding: 14px;
        border: 1px solid #222;
        border-radius: 12px;
        background: #111;
        font-size: 12px;
        color: #bbb;
        line-height: 1.55;
        display: grid;
        gap: 8px;
      }

      .manual-box strong {
        color: #fff;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin: 14px 0;
      }

      .stat-card {
        padding: 22px;
        border: 1px solid #202020;
        border-radius: 16px;
        background: #0b0b0b;
      }

      .stat-card strong {
        display: block;
        font-size: 22px;
        margin-bottom: 7px;
      }

      .stat-card small {
        color: #555;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: 1.6fr 0.8fr;
        gap: 14px;
        margin-top: 14px;
      }

      .panel {
        padding: 25px;
        border: 1px solid #202020;
        border-radius: 16px;
        background: #0b0b0b;
        margin-bottom: 16px;
      }

      .panel-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .panel h2 {
        margin: 6px 0 0;
        font-size: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        align-items: end;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        font-size: 11px;
        color: #888;
        font-weight: 600;
      }

      .filter-bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .filter-bar select,
      .filter-bar input {
        width: auto;
        min-width: 170px;
        padding: 9px 12px;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .list-item {
        padding: 15px 16px;
        border: 1px solid #1c1c1c;
        border-radius: 12px;
        background: #0f0f0f;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .list-item strong {
        display: block;
        font-size: 15px;
        margin-bottom: 4px;
      }

      .list-item small {
        color: #777;
        font-size: 12px;
      }

      .group-card {
        border: 1px solid #1e1e1e;
        border-radius: 14px;
        background: #0f0f0f;
        overflow: hidden;
      }

      .group-header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .group-children {
        border-top: 1px solid #1b1b1b;
        background: #090909;
        padding: 12px;
        display: grid;
        gap: 8px;
      }

      .badge {
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .badge-pending {
        background: #271f0e;
        color: #f5b942;
      }

      .badge-paid {
        background: #0e2618;
        color: #4ade80;
      }

      .empty {
        min-height: 180px;
        display: grid;
        place-content: center;
        text-align: center;
      }

      .empty-icon {
        color: #444;
        font-size: 30px;
      }

      .empty h3 {
        margin: 10px 0 5px;
        font-size: 16px;
      }

      .empty p,
      .page p {
        margin: 0;
        color: #555;
        font-size: 13px;
      }

      .quick-actions {
        display: grid;
        gap: 9px;
      }

      .quick-actions button {
        padding: 13px;
        border: 1px solid #252525;
        border-radius: 9px;
        background: #101010;
        color: #aaa;
        text-align: left;
      }

      .quick-actions button:hover {
        color: #fff;
        border-color: #3a3a3a;
      }

      .login-wrapper {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .login-box {
        width: 100%;
        max-width: 400px;
        padding: 32px;
        border: 1px solid #202020;
        border-radius: 20px;
        background: #0b0b0b;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }

      .credit-card-box {
        padding: 20px;
        border: 1px solid #262626;
        border-radius: 16px;
        background: linear-gradient(145deg, #141414, #0a0a0a);
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: #1c1c1c;
        border-radius: 999px;
        overflow: hidden;
        margin: 10px 0;
      }

      .progress-fill {
        height: 100%;
        background: #fff;
        transition: width 0.25s ease;
      }

      .error-box {
        max-width: 560px;
        margin: 40px auto;
        padding: 24px;
        border: 1px solid #3a1d1d;
        border-radius: 16px;
        background: #140909;
        color: #fca5a5;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      @media (max-width: 800px) {
        .sidebar {
          left: 0;
          top: 0;
          bottom: 0;
          width: 280px;
          padding: 22px 16px;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
          border-right: 1px solid #222;
        }

        .sidebar.mobile-open {
          transform: translateX(0);
        }

        .overlay.mobile-open {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.65);
          z-index: 999;
        }

        .main {
          width: 100%;
          margin-left: 0;
          padding-bottom: 20px;
        }

        .topbar {
          height: 70px;
          padding: 14px 16px;
        }

        .mobile-menu {
          display: grid;
          place-items: center;
        }

        .content {
          padding: 16px;
        }

        .hero {
          min-height: 150px;
          padding: 22px;
          align-items: flex-start;
          flex-direction: column;
        }

        .hero strong {
          font-size: 32px;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .dashboard-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="login-wrapper">
        <div id="boot-status" style="color: #777; font-size: 13px; text-align: center; max-width: 420px;" translate="no">
          Iniciando OR finance...
        </div>
      </div>
    </div>

    <script>
      window.addEventListener("error", function (event) {
        var el = document.getElementById("boot-status");
        if (el) {
          el.style.color = "#fca5a5";
          el.textContent = "Erro de script: " + (event.message || "Falha ao carregar");
        }
      });

      window.addEventListener("unhandledrejection", function (event) {
        var el = document.getElementById("boot-status");
        if (el) {
          el.style.color = "#fca5a5";
          var reason = event.reason && event.reason.message ? event.reason.message : String(event.reason || "Erro inesperado");
          el.textContent = "Falha de conexão: " + reason;
        }
      });

      (function configurarPwaInline() {
        function tracarRetanguloArredondado(ctx, x, y, w, h, r) {
          var radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        function criarIconePng(tamanho) {
          try {
            var canvas = document.createElement("canvas");
            canvas.width = tamanho;
            canvas.height = tamanho;
            var ctx = canvas.getContext("2d");
            if (!ctx) return "";

            var raio = Math.round(tamanho * 0.22);
            ctx.fillStyle = "#050505";
            tracarRetanguloArredondado(ctx, 0, 0, tamanho, tamanho, raio);
            ctx.fill();

            var borda = Math.max(2, Math.round(tamanho * 0.03));
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = borda;
            tracarRetanguloArredondado(
              ctx,
              borda * 2,
              borda * 2,
              tamanho - borda * 4,
              tamanho - borda * 4,
              Math.max(4, raio - borda)
            );
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = "800 " + Math.round(tamanho * 0.34) + "px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("OR", tamanho / 2, tamanho * 0.52);

            return canvas.toDataURL("image/png");
          } catch (e) {
            return "";
          }
        }

        var icon192 = criarIconePng(192);
        var icon512 = criarIconePng(512);

        var appleIconLink = document.getElementById("pwa-apple-icon");
        if (appleIconLink && icon192) {
          appleIconLink.href = icon192;
        }

        var manifestLink = document.getElementById("pwa-manifest");
        var iconesManifest = [];
        if (icon192) {
          iconesManifest.push({ src: icon192, sizes: "192x192", type: "image/png" });
        }
        if (icon512) {
          iconesManifest.push({ src: icon512, sizes: "512x512", type: "image/png" });
        }

        if (manifestLink && iconesManifest.length > 0) {
          var currentUrl = window.location.href.split("#")[0].split("?")[0];
          var scopeUrl = currentUrl.endsWith("/")
            ? currentUrl
            : currentUrl.substring(0, currentUrl.lastIndexOf("/") + 1);

          var manifestObj = {
            name: "OR finance",
            short_name: "OR finance",
            description: "Organizador financeiro pessoal",
            id: currentUrl,
            start_url: currentUrl,
            scope: scopeUrl,
            display: "standalone",
            orientation: "portrait",
            background_color: "#050505",
            theme_color: "#050505",
            icons: iconesManifest
          };

          manifestLink.href =
            "data:application/manifest+json;charset=utf-8," +
            encodeURIComponent(JSON.stringify(manifestObj));
        }

        var isSecure =
          window.isSecureContext ||
          window.location.protocol === "https:" ||
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";

        if (isSecure && "serviceWorker" in navigator) {
          var swCode = [
            "const CACHE_NAME = 'or-finance-pwa-v6';",
            "self.addEventListener('install', (event) => {",
            "  self.skipWaiting();",
            "  event.waitUntil(caches.open(CACHE_NAME));",
            "});",
            "self.addEventListener('activate', (event) => {",
            "  event.waitUntil(",
            "    caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))))",
            "  );",
            "  self.clients.claim();",
            "});",
            "self.addEventListener('fetch', (event) => {",
            "  if (event.request.method !== 'GET') return;",
            "  event.respondWith(",
            "    fetch(event.request)",
            "      .then((response) => {",
            "        if (response && response.status === 200) {",
            "          const clone = response.clone();",
            "          caches.open(CACHE_NAME).then((cache) => cache.put(event.request, clone));",
            "        }",
            "        return response;",
            "      })",
            "      .catch(() => caches.match(event.request))",
            "  );",
            "});"
          ].join("\n");

          var swDataUrl =
            "data:application/javascript;charset=utf-8," + encodeURIComponent(swCode);

          navigator.serviceWorker.register(swDataUrl).catch(function () {
            try {
              var swBlob = new Blob([swCode], { type: "application/javascript" });
              var swBlobUrl = URL.createObjectURL(swBlob);
              navigator.serviceWorker.register(swBlobUrl).catch(function () {});
            } catch (e) {}
          });
        }
      })();
    </script>

    <script type="text/babel">
      const { useEffect, useState, Component } = React;

      const SUPABASE_URL = "https://qprlpwyvssxjzcftkgav.supabase.co";
      const SUPABASE_KEY = "sb_publishable_hGG9yCIjIcvmIqo69n5nRQ_uImcekYe";

      if (!window.supabase || !window.supabase.createClient) {
        throw new Error("Biblioteca do Supabase não carregou. Verifique a conexão com a internet.");
      }

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const menu = [
        "Início",
        "Contas",
        "Entradas",
        "Saídas",
        "Transferências",
        "Contas a pagar",
        "Contas recorrentes",
        "Cartões",
        "Metas",
        "Relatórios",
      ];

      class ErrorBoundary extends Component {
        constructor(props) {
          super(props);
          this.state = { error: null };
        }

        static getDerivedStateFromError(error) {
          return { error };
        }

        render() {
          if (this.state.error) {
            return (
              <div className="login-wrapper">
                <div className="error-box">
                  <strong>Erro na interface do OR finance:</strong>
                  <div style={{ marginTop: 8 }}>
                    {this.state.error.message || String(this.state.error)}
                  </div>
                  <button
                    type="button"
                    className="primary-button"
                    style={{ marginTop: 14 }}
                    onClick={() => window.location.reload()}
                  >
                    Recarregar página
                  </button>
                </div>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function normalizarId(valor) {
        if (valor === undefined || valor === null) return null;
        const texto = String(valor).trim();
        if (!texto || texto === "null" || texto === "undefined") return null;
        return texto;
      }

      function getCardId(card) {
        return normalizarId(card?.id);
      }

      function getCardIdColumn() {
        return "id";
      }

      function isUuid(valor) {
        return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
          String(valor || "")
        );
      }

      function moeda(valor) {
        return `R$ ${Number(valor || 0).toFixed(2).replace(".", ",")}`;
      }

      function adicionarMes(data, quantidade) {
        const base = data instanceof Date ? new Date(data.getTime()) : new Date(data);
        const diaOriginal = base.getDate();
        const anoDestino = base.getFullYear();
        const mesDestino = base.getMonth() + Number(quantidade || 0);
        const ultimoDia = new Date(anoDestino, mesDestino + 1, 0).getDate();
        return new Date(anoDestino, mesDestino, Math.min(diaOriginal, ultimoDia));
      }

      function formatarData(data) {
        if (!data) return "-";
        const partes = String(data).slice(0, 10).split("-");
        if (partes.length === 3) {
          return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }
        return new Date(data).toLocaleDateString("pt-BR");
      }

      function formatarMesAno(ym) {
        if (!ym) return "Todos os meses";
        const [ano, mes] = String(ym).split("-");
        const nomes = [
          "Jan",
          "Fev",
          "Mar",
          "Abr",
          "Mai",
          "Jun",
          "Jul",
          "Ago",
          "Set",
          "Out",
          "Nov",
          "Dez",
        ];
        const idx = Number(mes) - 1;
        return `${nomes[idx] || mes}/${ano}`;
      }

      function dataParaString(data) {
        const ano = data.getFullYear();
        const mes = String(data.getMonth() + 1).padStart(2, "0");
        const dia = String(data.getDate()).padStart(2, "0");
        return `${ano}-${mes}-${dia}`;
      }

      function extrairNomeBaseRecorrente(descricao) {
        return String(descricao || "")
          .replace(/\s*\(\d+\/\d+\)\s*$/, "")
          .replace(/\s*\(Pago c\/ desc\..*\)$/, "")
          .trim();
      }

        async function carregarCartoes(uidAtual) {
          const uid = uidAtual || userId;
          if (!uid) return;

          const { data: cartoesData, error: erroCartoes } = await supabase
            .from("cards")
            .select("*")
            .eq("user_id", uid)
            .order("created_at", { ascending: false });

          if (erroCartoes) {
            console.error("Erro cartões:", erroCartoes.message);
            return;
          }

          const { data: comprasData } = await supabase
            .from("card_purchases")
            .select("id, card_id")
            .eq("user_id", uid);

          const { data: parcelasData } = await supabase
            .from("card_installments")
            .select("purchase_id, amount, status")
            .eq("user_id", uid)
            .eq("status", "pending");

          const compraParaCartao = new Map(
            (comprasData || []).map((compra) => [
              String(compra.id),
              String(compra.card_id),
            ])
          );

          const utilizadoPorCartao = {};

          for (const parcela of parcelasData || []) {
            const cardId = compraParaCartao.get(String(parcela.purchase_id));
            if (!cardId) continue;
            utilizadoPorCartao[cardId] =
              (utilizadoPorCartao[cardId] || 0) + Number(parcela.amount || 0);
          }

          const cartoesAtualizados = [];

          for (const cartao of cartoesData || []) {
            const idCartao = getCardId(cartao);
            if (!isUuid(idCartao)) continue;

            const limite = Number(cartao.credit_limit || 0);
            const utilizado = Number(utilizadoPorCartao[String(idCartao)] || 0);
            const disponivel = Math.max(0, limite - utilizado);

            if (Math.abs(Number(cartao.available_limit || 0) - disponivel) > 0.009) {
              await supabase
                .from("cards")
                .update({ available_limit: disponivel })
                .eq(getCardIdColumn(cartao), idCartao)
                .eq("user_id", uid);
            }

            cartoesAtualizados.push({
              ...cartao,
              available_limit: disponivel,
            });
          }

          setCartoes(cartoesAtualizados);
        }

        async function realizarTransferencia(e) {
          e.preventDefault();
          const origem = contas[Number(contaOrigemTransf)];
          const destino = contas[Number(contaDestinoTransf)];

          if (!origem || !destino) {
            alert("Selecione a conta de origem e a conta de destino.");
            return;
          }

          const idOrigem = origem.id ?? origem.uuid;
          const idDestino = destino.id ?? destino.uuid;

          if (String(idOrigem) === String(idDestino)) {
            alert("A conta de origem e a conta de destino devem ser diferentes.");
            return;
          }

          const valor = Number(valorTransf) || 0;
          if (valor <= 0) {
            alert("Informe um valor maior que zero para transferir.");
            return;
          }

          const novoSaldoOrigem = Number(origem.balance || 0) - valor;
          const novoSaldoDestino = Number(destino.balance || 0) + valor;

          const colOrigem = origem.id !== undefined ? "id" : "uuid";
          const colDestino = destino.id !== undefined ? "id" : "uuid";

          const { error: erroOrigem } = await supabase
            .from("accounts")
            .update({ balance: novoSaldoOrigem })
            .eq(colOrigem, idOrigem);

          if (erroOrigem) {
            alert(`Erro ao debitar conta de origem: ${erroOrigem.message}`);
            return;
          }

          const { error: erroDestino } = await supabase
            .from("accounts")
            .update({ balance: novoSaldoDestino })
            .eq(colDestino, idDestino);

          if (erroDestino) {
            await supabase
              .from("accounts")
              .update({ balance: Number(origem.balance || 0) })
              .eq(colOrigem, idOrigem);
            alert(`Erro ao creditar conta de destino: ${erroDestino.message}`);
            return;
          }

          const novaTransf = {
            id: Date.now(),
            from_account_id: idOrigem,
            from_account_name: origem.name,
            to_account_id: idDestino,
            to_account_name: destino.name,
            amount: valor,
            description: descricaoTransf.trim() || "Transferência entre contas",
            transfer_date: new Date().toISOString().split("T")[0],
          };

          const atualizadas = [novaTransf, ...transferencias];
          setTransferencias(atualizadas);
          salvarTransferenciasLocal(atualizadas);

          setContaOrigemTransf("");
          setContaDestinoTransf("");
          setValorTransf("");
          setDescricaoTransf("");

          await carregarContas();
          alert("Transferência realizada com sucesso!");
        }

        async function criarContaRecorrente(e) {
          e.preventDefault();
          const conta = contas[Number(contaRecorrenteSelecionada)];
          if (!conta) {
            alert("Selecione a conta.");
            return;
          }

          const accountId = conta.id ?? conta.uuid;
          if (!userId || !accountId) return;

          if (recorrenteEditando) {
            const { error } = await supabase
              .from("bills")
              .update({
                account_id: accountId,
                description: descricaoRecorrente,
                amount: Number(valorRecorrente) || 0,
                due_date: vencimentoRecorrente,
                recurring: true,
              })
              .eq("id", recorrenteEditando.id);

            if (error) {
              alert(error.message);
              return;
            }

            cancelarEdicaoRecorrente();
            await carregarContasPagar();
            alert("Conta recorrente atualizada com sucesso!");
            return;
          }

          const dataBase = new Date(`${vencimentoRecorrente}T00:00:00`);
          const valorNumerico = Number(valorRecorrente) || 0;
          const descBase = descricaoRecorrente.trim();
          const registros = [];

          if (tipoRecorrencia === "parcelamento") {
            const totalParcelas = Math.min(120, Math.max(1, Number(totalParcelasFinanciamento) || 1));
            const parcelaInicial = Math.min(
              totalParcelas,
              Math.max(1, Number(parcelaInicialRecorrente) || 1)
            );
            const qtdGerar = totalParcelas - parcelaInicial + 1;

            for (let i = 0; i < qtdGerar; i++) {
              const dataParcela = adicionarMes(dataBase, i);
              const numeroAtual = parcelaInicial + i;

              registros.push({
                user_id: userId,
                account_id: accountId,
                description: `${descBase} (${numeroAtual}/${totalParcelas})`,
                amount: valorNumerico,
                due_date: dataParaString(dataParcela),
                status: "pending",
                recurring: true,
              });
            }
          } else {
            const totalMeses = Math.min(60, Math.max(1, Number(quantidadeMesesRecorrente) || 1));

            for (let i = 0; i < totalMeses; i++) {
              const dataParcela = adicionarMes(dataBase, i);

              registros.push({
                user_id: userId,
                account_id: accountId,
                description: descBase,
                amount: valorNumerico,
                due_date: dataParaString(dataParcela),
                status: "pending",
                recurring: true,
              });
            }
          }

          const { error } = await supabase.from("bills").insert(registros);

          if (error) {
            alert(error.message);
            return;
          }

          cancelarEdicaoRecorrente();
          await carregarContasPagar();
          alert(
            registros.length > 1
              ? `${registros.length} lançamento(s) gerado(s) com sucesso!`
              : "Conta recorrente cadastrada com sucesso!"
          );
        }

        async function confirmarPagamentoConta(e) {
          e.preventDefault();
          if (!contaPagamentoModal || contaPagamentoModal.status === "paid") return;

          const contaSelecionada = contas.find(
            (item) => (item.id ?? item.uuid) === contaPagamentoModal.account_id
          );

          if (!contaSelecionada) {
            alert("Conta bancária não encontrada.");
            return;
          }

          const valorOriginal = Number(contaPagamentoModal.amount || 0);
          const desconto = Math.max(0, Number(descontoPagamento) || 0);

          if (desconto > valorOriginal) {
            alert("O desconto não pode ser maior que o valor da conta.");
            return;
          }

          const valorFinal = Math.max(0, valorOriginal - desconto);
          const novoSaldo = Number(contaSelecionada.balance || 0) - valorFinal;
          const colunaId = contaSelecionada.id !== undefined ? "id" : "uuid";

          setProcessandoPagamento(true);
          try {
            const { error: erroSaldo } = await supabase
              .from("accounts")
              .update({ balance: novoSaldo })
              .eq(colunaId, contaPagamentoModal.account_id);

            if (erroSaldo) {
              alert(erroSaldo.message);
              return;
            }

            const descricaoOriginalLimpa = String(contaPagamentoModal.description || "").replace(
              /\s*\(Pago c\/ desc\..*\)$/,
              ""
            );

            const descricaoAtualizada =
              desconto > 0
                ? `${descricaoOriginalLimpa} (Pago c/ desc. de ${moeda(desconto)})`
                : descricaoOriginalLimpa;

            const { error } = await supabase
              .from("bills")
              .update({
                description: descricaoAtualizada,
                amount: valorFinal,
                status: "paid",
                paid_date: new Date().toISOString().split("T")[0],
              })
              .eq("id", contaPagamentoModal.id);

            if (error) {
              alert(error.message);
              return;
            }

            const temNumeracaoParcela = /\(\d+\/\d+\)/.test(descricaoOriginalLimpa);
            if (contaPagamentoModal.recurring && !temNumeracaoParcela && contaPagamentoModal.due_date) {
              const proximoVenc = dataParaString(
                adicionarMes(new Date(`${contaPagamentoModal.due_date}T00:00:00`), 1)
              );
              const jaExisteProximo = contasPagar.some(
                (b) =>
                  b.recurring &&
                  b.id !== contaPagamentoModal.id &&
                  String(b.description || "").startsWith(descricaoOriginalLimpa) &&
                  String(b.due_date || "").slice(0, 7) === proximoVenc.slice(0, 7)
              );

              if (!jaExisteProximo) {
                await supabase.from("bills").insert({
                  user_id: userId,
                  account_id: contaPagamentoModal.account_id,
                  description: descricaoOriginalLimpa,
                  amount: valorOriginal,
                  due_date: proximoVenc,
                  status: "pending",
                  recurring: true,
                });
              }
            }

            setContaPagamentoModal(null);
            setDescontoPagamento("");
            await carregarContas();
            await carregarContasPagar();
            alert(
              desconto > 0
                ? `Conta paga com desconto! Valor pago: ${moeda(valorFinal)} (economia de ${moeda(desconto)}).`
                : "Conta paga com sucesso!"
            );
          } finally {
            setProcessandoPagamento(false);
          }
        }

        async function pagarFatura(fatura) {
          if (fatura.status === "paid") return;

          const contaId = contasFaturaSelecionadas[fatura.id];
          const contaSelecionada = contas.find(
            (item) => String(item.id ?? item.uuid) === String(contaId)
          );

          if (!contaSelecionada) {
            alert("Selecione a conta bancária que será usada para pagar a fatura.");
            return;
          }

          const restante = Math.max(
            0,
            Number(fatura.total_amount || 0) - Number(fatura.paid_amount || 0)
          );
          if (restante <= 0) return;

          const confirmar = window.confirm(
            `Confirmar pagamento da fatura no valor de ${moeda(restante)}?`
          );
          if (!confirmar) return;

          const novoSaldo = Number(contaSelecionada.balance || 0) - restante;
          const colunaId = contaSelecionada.id !== undefined ? "id" : "uuid";

          const { error: erroSaldo } = await supabase
            .from("accounts")
            .update({ balance: novoSaldo })
            .eq(colunaId, contaId);

          if (erroSaldo) {
            alert(erroSaldo.message);
            return;
          }

          const novoPago = Number(fatura.paid_amount || 0) + restante;

          const { error: erroFatura } = await supabase
            .from("invoices")
            .update({
              paid_amount: novoPago,
              status: "paid",
            })
            .eq("id", fatura.id);

          if (erroFatura) {
            alert(erroFatura.message);
            return;
          }

          const { data: comprasDaFatura } = await supabase
            .from("card_purchases")
            .select("id")
            .eq("invoice_id", fatura.id);

          if (comprasDaFatura?.length) {
            const ids = comprasDaFatura.map((compra) => compra.id);
            await supabase
              .from("card_installments")
              .update({ status: "paid" })
              .in("purchase_id", ids)
              .eq("due_date", fatura.due_date);
          }

          await carregarContas();
          await carregarCartoes(userId);
          await carregarFaturas();
          await carregarParcelas();
          alert("Fatura paga com sucesso!");
        }

        function calcularFatura(card, data) {
          const compra = new Date(`${data}T00:00:00`);
          const fechamento = Number(card.closing_day || 31);
          const vencimento = Number(card.due_day || 10);

          let referencia = new Date(compra.getFullYear(), compra.getMonth(), 1);
          if (compra.getDate() > fechamento) {
            referencia = adicionarMes(referencia, 1);
          }

          const ultimoDiaFechamento = new Date(
            referencia.getFullYear(),
            referencia.getMonth() + 1,
            0
          ).getDate();

          const diaFechamento = Math.min(fechamento, ultimoDiaFechamento);
          const dataFechamento = new Date(
            referencia.getFullYear(),
            referencia.getMonth(),
            diaFechamento
          );

          let anoVencimento = referencia.getFullYear();
          let mesVencimento = referencia.getMonth();
          if (vencimento <= diaFechamento) {
            mesVencimento += 1;
          }

          const ultimoDiaVencimento = new Date(
            anoVencimento,
            mesVencimento + 1,
            0
          ).getDate();

          const diaVencimento = Math.min(vencimento, ultimoDiaVencimento);
          const dataVencimento = new Date(
            anoVencimento,
            mesVencimento,
            diaVencimento
          );

          return {
            referenceMonth: `${referencia.getFullYear()}-${String(
              referencia.getMonth() + 1
            ).padStart(2, "0")}-01`,
            closingDate: dataParaString(dataFechamento),
            dueDate: dataParaString(dataVencimento),
          };
        }

        async function criarCompra(e) {
          e.preventDefault();

          if (!userId || !isUuid(userId)) {
            alert("Sua sessão não possui um ID de usuário válido. Faça login novamente.");
            return;
          }

          const cartao = cartoes.find(
            (item) => String(getCardId(item)) === String(cartaoCompra)
          );

          if (!cartao) {
            alert("Selecione um cartão.");
            return;
          }

          const idCartao = getCardId(cartao);
          if (!isUuid(idCartao)) {
            alert("O cartão selecionado possui um ID inválido no banco de dados.");
            return;
          }

          const valor = Number(valorCompra) || 0;
          const totalParcelas = Math.max(1, Number(totalParcelasCompra) || 1);

          if (valor <= 0) {
            alert("Informe um valor válido.");
            return;
          }

          const limiteDisponivelAtual = Number(
            cartao.available_limit ?? cartao.credit_limit ?? 0
          );

          if (valor > limiteDisponivelAtual) {
            alert(
              `Compra não autorizada. O limite disponível é de ${moeda(
                limiteDisponivelAtual
              )}.`
            );
            return;
          }

          const valorParcela = valor / totalParcelas;
          const primeiraFaturaDados = calcularFatura(cartao, dataCompra);
          const faturasCompra = [];

          for (let i = 1; i <= totalParcelas; i++) {
            const referencia = adicionarMes(
              new Date(`${primeiraFaturaDados.referenceMonth}T00:00:00`),
              i - 1
            );
            const fechamento = adicionarMes(
              new Date(`${primeiraFaturaDados.closingDate}T00:00:00`),
              i - 1
            );
            const vencimento = adicionarMes(
              new Date(`${primeiraFaturaDados.dueDate}T00:00:00`),
              i - 1
            );

            const dadosFatura = {
              referenceMonth: `${referencia.getFullYear()}-${String(
                referencia.getMonth() + 1
              ).padStart(2, "0")}-01`,
              closingDate: dataParaString(fechamento),
              dueDate: dataParaString(vencimento),
            };

            let { data: fatura, error: erroBusca } = await supabase
              .from("invoices")
              .select(
                "id, user_id, card_id, reference_month, closing_date, due_date, total_amount, paid_amount, status"
              )
              .eq("user_id", userId)
              .eq("card_id", idCartao)
              .eq("reference_month", dadosFatura.referenceMonth)
              .maybeSingle();

            if (erroBusca) {
              alert(`Erro ao buscar a fatura: ${erroBusca.message}`);
              return;
            }

            if (!fatura) {
              const resultado = await supabase
                .from("invoices")
                .insert({
                  user_id: userId,
                  card_id: idCartao,
                  reference_month: dadosFatura.referenceMonth,
                  closing_date: dadosFatura.closingDate,
                  due_date: dadosFatura.dueDate,
                  total_amount: 0,
                  paid_amount: 0,
                  status: "open",
                })
                .select(
                  "id, user_id, card_id, reference_month, closing_date, due_date, total_amount, paid_amount, status"
                )
                .single();

              if (resultado.error) {
                alert(`Erro ao criar a fatura: ${resultado.error.message}`);
                return;
              }

              fatura = resultado.data;
            }

            if (!fatura?.id || !isUuid(fatura.id)) {
              alert("O banco não retornou um ID válido para a fatura.");
              return;
            }

            faturasCompra.push({ fatura, valorParcela });
          }

          const idFaturaPrincipal = faturasCompra[0]?.fatura?.id;
          if (!idFaturaPrincipal || !isUuid(idFaturaPrincipal)) {
            alert("A fatura selecionada possui um ID inválido.");
            return;
          }

          const dadosCompra = {
            user_id: userId,
            card_id: idCartao,
            invoice_id: idFaturaPrincipal,
            description: descricaoCompra,
            amount: valor,
            purchase_date: dataCompra,
            total_installments: totalParcelas,
            current_installment: 1,
          };

          if (observacaoCompra?.trim()) {
            dadosCompra.notes = observacaoCompra.trim();
          }

          const { data: compraCriada, error: erroCompra } = await supabase
            .from("card_purchases")
            .insert(dadosCompra)
            .select(
              "id, user_id, card_id, invoice_id, description, amount, purchase_date, total_installments, current_installment, notes"
            )
            .single();

          if (erroCompra) {
            alert(`Erro ao registrar a compra: ${erroCompra.message}`);
            return;
          }

          if (!compraCriada?.id || !isUuid(compraCriada.id)) {
            alert("A compra foi registrada, mas o banco não retornou um ID válido.");
            return;
          }

          const listaParcelas = faturasCompra.map(
            ({ fatura, valorParcela }, index) => ({
              user_id: userId,
              purchase_id: compraCriada.id,
              installment_number: index + 1,
              total_installments: totalParcelas,
              amount: valorParcela,
              due_date: fatura.due_date,
              status: "pending",

          );

          const { error: erroParcelas } = await supabase
            .from("card_installments")
            .insert(listaParcelas);

            await supabase
              .from("card_purchases")
              .delete()
              .eq("id", compraCriada.id)
              .eq("user_id", userId);

            alert(`Erro ao registrar as parcelas: ${erroParcelas.message}`);
            return;

              .from("invoices")
              .update({ total_amount: novoTotal })
              .eq("id", fatura.id)
              .eq("user_id", userId);

              alert(`Erro ao atualizar a fatura: ${erroAtualizacaoFatura.message}`);
              return;
            }
          }

          setValorCompra("");
          setDataCompra(new Date().toISOString().split("T")[0]);
          setTotalParcelasCompra("1");
          setObservacaoCompra("");

          await carregarCartoes(userId);
          await carregarCompras();
          await carregarParcelas();
          await carregarFaturas();

          alert("Compra registrada com sucesso!");

          e.preventDefault();

            id: Date.now(),
            titulo: tituloMeta,
            alvo: Number(valorAlvoMeta) || 0,

          );

                            >
                              <option value="">Selecione...</option>
                              {cartoes.map((card) => (
                                <option key={card.id} value={getCardId(card)}>
                                  {card.name} (Disp: {moeda(card.available_limit)})
                                </option>
                              ))}
                            </select>
                          </div>
                          <div className="field">
                            <label>DESCRIÇÃO</label>
                            <input
                              required
                              placeholder="Ex: Supermercado, Celular..."
                              value={descricaoCompra}
                              onChange={(e) => setDescricaoCompra(e.target.value)}
                            />
                          </div>
                          <div className="field">
                            <label>VALOR TOTAL (R$)</label>
                            <input
                              type="number"
                              step="0.01"
                              required
                              placeholder="0.00"
                              value={valorCompra}
                              onChange={(e) => setValorCompra(e.target.value)}
                            />
                          </div>
                          <div className="field">
                            <label>DATA DA COMPRA</label>
                            <input
                              type="date"
                              required
                              value={dataCompra}
                              onChange={(e) => setDataCompra(e.target.value)}
                            />
                          </div>
                          <div className="field">
                            <label>PARCELAS</label>
                            <input
                              type="number"
                              min="1"
                              max="48"
                              value={totalParcelasCompra}
                              onChange={(e) => setTotalParcelasCompra(e.target.value)}
                            />
                          </div>
                          <div className="field">
                            <label>OBSERVAÇÃO</label>
                            <input
                              placeholder="Opcional"
                              value={observacaoCompra}
                              onChange={(e) => setObservacaoCompra(e.target.value)}
                            />
                          </div>
                          <button type="submit" className="primary-button">
                            Registrar compra
                          </button>
                        </form>
                      </div>

                      <div className="panel">
                        <div className="panel-title">
                          <div>
                            <span>FATURAS</span>
                            <h2>Faturas ({faturas.length})</h2>
                          </div>
                        </div>
                        <div className="list">
                          {faturas.map((f) => {
                            const restante = Math.max(
                              0,
                              Number(f.total_amount || 0) - Number(f.paid_amount || 0)
                            );
                            return (
                              <div key={f.id} className="list-item">
                                <div>
                                  <strong>
                                    {nomeCartaoPorId(f.card_id)} — Venc. {formatarData(f.due_date)}
                                  </strong>
                                  <small>
                                    Total: {moeda(f.total_amount)} • Pago: {moeda(f.paid_amount)} •
                                    Restante: {moeda(restante)}
                                  </small>
                                </div>
                                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                                  <span
                                    className={`badge ${
                                      f.status === "paid" ? "badge-paid" : "badge-pending"
                                    }`}
                                  >
                                    {f.status === "paid" ? "Paga" : "Aberta"}
                                  </span>
                                  {f.status !== "paid" && (
                                    <>
                                      <select
                                        style={{ width: 170 }}
                                        value={contasFaturaSelecionadas[f.id] || ""}
                                        onChange={(e) =>
                                          setContasFaturaSelecionadas((prev) => ({
                                            ...prev,
                                            [f.id]: e.target.value,
                                          }))
                                        }
                                      >
                                        <option value="">Conta pagadora...</option>
                                        {contas.map((c) => (
                                          <option key={c.id ?? c.uuid} value={c.id ?? c.uuid}>
                                            {c.name}
                                          </option>
                                        ))}
                                      </select>
                                      <button
                                        type="button"
                                        className="primary-button"
                                        onClick={() => pagarFatura(f)}
                                      >
                                        Pagar fatura
                                      </button>
                                    </>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div className="panel">
                        <div className="panel-title">
                          <div>
                            <span>PARCELAS</span>
                            <h2>Parcelas ({parcelas.length})</h2>
                          </div>
                        </div>
                        <div className="list">
                          {parcelas.map((p) => {
                            const compraRel = compras.find((c) => c.id === p.purchase_id);
                            return (
                              <div key={p.id} className="list-item">
                                <div>
                                  <strong>
                                    {compraRel?.description || "Compra"} ({p.installment_number}/
                                    {p.total_installments})
                                  </strong>
                                  <small>
                                    Vencimento: {formatarData(p.due_date)} • Valor: {moeda(p.amount)}
                                  </small>
                                </div>
                                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                                  <span
                                    className={`badge ${
                                      p.status === "paid" ? "badge-paid" : "badge-pending"
                                    }`}
                                  >
                                    {p.status === "paid" ? "Paga" : "Pendente"}
                                  </span>
                                  {p.status !== "paid" && (
                                    <>
                                      <select
                                        style={{ width: 170 }}
                                        value={contasParcelaSelecionadas[p.id] || ""}
                                        onChange={(e) =>
                                          setContasParcelaSelecionadas((prev) => ({
                                            ...prev,
                                            [p.id]: e.target.value,
                                          }))
                                        }
                                      >
                                        <option value="">Conta pagadora...</option>
                                        {contas.map((c) => (
                                          <option key={c.id ?? c.uuid} value={c.id ?? c.uuid}>
                                            {c.name}
                                          </option>
                                        ))}
                                      </select>
                                      <button
                                        type="button"
                                        className="secondary-button"
                                        onClick={() => pagarParcela(p)}
                                      >
                                        Pagar parcela
                                      </button>
                                    </>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </>
                  )}

                  {active === "Metas" && (
                    <>
                      <div className="panel">
                        <div className="panel-title">
                          <div>
                            <span>OBJETIVOS</span>
                            <h2>Nova meta financeira</h2>
                          </div>
                        </div>
                        <form className="form-grid" onSubmit={adicionarMeta}>
                          <div className="field">
                            <label>TÍTULO DA META</label>
                            <input
                              required
                              placeholder="Ex: Reserva de emergência, Moto..."
                              value={tituloMeta}
                              onChange={(e) => setTituloMeta(e.target.value)}
                            />
                          </div>
                          <div className="field">
                            <label>VALOR OBJETIVO (R$)</label>
                            <input
                              type="number"
                              step="0.01"
                              required
                              placeholder="0.00"
                              value={valorAlvoMeta}
                              onChange={(e) => setValorAlvoMeta(e.target.value)}
                            />
                          </div>
                          <div className="field">
                            <label>VALOR JÁ GUARDADO (R$)</label>
                            <input
                              type="number"
                              step="0.01"
                              placeholder="0.00"
                              value={valorAtualMeta}
                              onChange={(e) => setValorAtualMeta(e.target.value)}
                            />
                          </div>
                          <button type="submit" className="primary-button">
                            Criar meta
                          </button>
                        </form>
                      </div>

                      <div className="panel">
                        <div className="panel-title">
                          <div>
                            <span>ACOMPANHAMENTO</span>
                            <h2>Minhas metas ({metas.length})</h2>
                          </div>
                        </div>
                        <div className="list">
                          {metas.map((m) => {
                            const pct =
                              m.alvo > 0 ? Math.min(100, (m.atual / m.alvo) * 100) : 0;
                            return (
                              <div key={m.id} className="list-item" style={{ display: "block" }}>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                  <strong>{m.titulo}</strong>
                                  <span>{pct.toFixed(1)}%</span>
                                </div>
                                <div className="progress-bar">
                                  <div className="progress-fill" style={{ width: `${pct}%` }} />
                                </div>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                                  <small>
                                    {moeda(m.atual)} de {moeda(m.alvo)}
                                  </small>
                                  <div style={{ display: "flex", gap: 6 }}>
                                    <button
                                      type="button"
                                      className="secondary-button"
                                      onClick={() => atualizarMeta(m.id, 100)}
                                    >
                                      + R$ 100
                                    </button>
                                    <button
                                      type="button"
                                      className="secondary-button"
                                      onClick={() => removerMeta(m.id)}
                                    >
                                      Excluir
                                    </button>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </>
                  )}

                  {active === "Relatórios" && (
                    <div className="panel">
                      <div className="panel-title">
                        <div>
                          <span>BALANÇO GERAL</span>
                          <h2>Resumo financeiro</h2>
                        </div>
                      </div>
                      <div className="stats">
                        <div className="stat-card">
                          <span>TOTAL DE ENTRADAS</span>
                          <strong style={{ color: "#4ade80" }}>
                            {exibirValor(totalEntradas)}
                          </strong>
                        </div>
                        <div className="stat-card">
                          <span>TOTAL DE SAÍDAS</span>
                          <strong style={{ color: "#f87171" }}>
                            {exibirValor(totalSaidas)}
                          </strong>
                        </div>
                        <div className="stat-card">
                          <span>SALDO LÍQUIDO (ENTRADAS - SAÍDAS)</span>
                          <strong>{exibirValor(totalEntradas - totalSaidas)}</strong>
                        </div>
                      </div>
                      <div className="list" style={{ marginTop: 14 }}>
                        <div className="list-item">
                          <div>
                            <strong>Total em contas bancárias</strong>
                            <small>{contas.length} conta(s) cadastrada(s)</small>
                          </div>
                          <strong>{exibirValor(saldoTotal)}</strong>
                        </div>
                        <div className="list-item">
                          <div>
                            <strong>Limite total de crédito</strong>
                            <small>{cartoes.length} cartão(ões)</small>
                          </div>
                          <strong>
                            {exibirValor(
                              cartoes.reduce((acc, c) => acc + Number(c.credit_limit || 0), 0)
                            )}
                          </strong>
                        </div>
                        <div className="list-item">
                          <div>
                            <strong>Contas a pagar / recorrentes pendentes</strong>
                            <small>
                              {contasPagar.filter((c) => c.status !== "paid").length} item(ns)
                            </small>
                          </div>
                          <strong>
                            {exibirValor(
                              contasPagar
                                .filter((c) => c.status !== "paid")
                                .reduce((acc, c) => acc + Number(c.amount || 0), 0)
                            )}
                          </strong>
                        </div>
                      </div>
                    </div>
                  )}
                </section>
              </main>
            </div>
          </div>
        );
      }

      function App() {
        const [session, setSession] = useState(null);
        const [carregandoSessao, setCarregandoSessao] = useState(true);

        useEffect(() => {
          let ativo = true;

          supabase.auth
            .getSession()
            .then(({ data }) => {
              if (!ativo) return;
              setSession(data?.session || null);
              setCarregandoSessao(false);
            })
            .catch(() => {
              if (!ativo) return;
              setCarregandoSessao(false);
            });

          const {
            data: { subscription },
          } = supabase.auth.onAuthStateChange((_event, novaSessao) => {
            if (!ativo) return;
            setSession(novaSessao || null);
            setCarregandoSessao(false);
          });

          return () => {
            ativo = false;
            subscription?.unsubscribe();
          };
        }, []);

        async function sair() {
          await supabase.auth.signOut();
          setSession(null);
        }

        if (carregandoSessao) {
          return (
            <div className="login-wrapper">
              <div style={{ color: "#777" }} translate="no">Carregando OR finance...</div>
            </div>
          );
        }

        if (!session) {
          return <Login onLogin={setSession} />;
        }

        return (
          <Painel email={session.user?.email} sair={sair} userId={session.user?.id} />
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    </script>
  </body>
</html>
